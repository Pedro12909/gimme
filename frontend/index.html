<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable app; on Android it also appears in the share sheet of shop apps -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Share a wishlist. Friends claim gifts, you keep the surprise."
    />
    <!-- Link previews in WhatsApp, Messages, Slack... Crawlers don't run JavaScript, so these are
         the same for every page, and the image URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gimme" />
    <meta
      property="og:title"
      content="gimme · Wishlists that keep the surprise"
    />
    <meta
      property="og:description"
      content="Share one link. Friends claim gifts. You never see who got what."
    />
    <meta property="og:image" content="https://gimme.rtemis.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="gimme: Wishlists that keep the surprise."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>gimme</title>
    <!-- Layout for the loading skeleton below, which shows before the app's code arrives.
         Mirrors PageSkeleton (components/skeleton.tsx); the .bone style comes from index.css. -->
    <style>
      .boot {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .boot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 56px;
      }
      .boot .bone {
        display: block;
        border-radius: 8px;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px 12px;
        margin-top: 32px;
      }
      .boot-grid .bone {
        aspect-ratio: 1;
        border-radius: 10px;
      }
      @media (width >= 640px) {
        .boot {
          padding: 0 32px;
        }
        .boot-header {
          min-height: 60px;
        }
        .boot-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 24px 20px;
        }
      }
      @media (width >= 1024px) {
        .boot-grid {
          grid-template-columns: repeat(4, 1fr);
          gap: 32px 20px;
        }
      }
    </style>
    <script>
      // Apply the theme before first paint: a stored choice wins, otherwise follow the device
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        const stored = () => {
          try {
            return localStorage.getItem("gimme:theme");
          } catch {
            return null;
          }
        };
        const apply = () => {
          const theme = stored() ?? (query.matches ? "dark" : "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
        };
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <!-- React replaces this skeleton as soon as it renders -->
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-header">
          <span class="bone" style="width: 56px; height: 16px"></span>
          <span class="bone" style="width: 96px; height: 16px"></span>
        </div>
        <span
          class="bone"
          style="margin-top: 16px; width: 75%; max-width: 400px; height: 36px"
        ></span>
        <span
          class="bone"
          style="margin-top: 12px; width: 176px; height: 14px"
        ></span>
        <div class="boot-grid">
          <span class="bone"></span><span class="bone"></span
          ><span class="bone"></span><span class="bone"></span>
          <span class="bone"></span><span class="bone"></span
          ><span class="bone"></span><span class="bone"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
