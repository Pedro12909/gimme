<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Share a wishlist. Friends claim gifts, you keep the surprise."
    />
    <title>gimme</title>
    <script>
      // Apply the theme before first paint: a stored choice wins, otherwise follow the device
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        const stored = () => {
          try {
            return localStorage.getItem("gimme:theme");
          } catch {
            return null;
          }
        };
        const apply = () => {
          const theme = stored() ?? (query.matches ? "dark" : "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
        };
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
