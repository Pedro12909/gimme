<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelf — Christmas 2026 (owner)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f4f2}
a{color:#141414;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:hover{text-decoration:underline;text-underline-offset:3px}
input::placeholder{color:#6a6a66}
input:focus{outline:none;border-color:#141414}
</style>
</helmet>
<div style="font-family: 'Archivo', sans-serif; color: #141414; background: #f4f4f2; min-height: 1000px; box-sizing: border-box">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 18px 32px">
    <a href="#" style="font-weight: 700; font-size: 17px; font-stretch: 112%; letter-spacing: -0.01em">gimme</a>
    <nav style="display: flex; gap: 24px; font-size: 14px"><a href="#">Lists</a><a href="#">Account</a></nav>
  </header>

  <main style="max-width: 1216px; margin: 0 auto; padding: 32px 32px 64px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px">
      <div>
        <h1 style="margin: 0; font-size: 56px; line-height: 1; font-weight: 700; font-stretch: 75%; letter-spacing: -0.01em; text-transform: uppercase">Christmas 2026</h1>
        <p style="margin: 10px 0 0; font-size: 14px; color: #6a6a66">25 December · 6 things</p>
      </div>
      <div style="display: flex; gap: 24px; font-size: 14px">
        <button type="button">Copy share link</button>
        <button type="button">Edit list</button>
      </div>
    </div>

    <form style="margin-top: 32px">
      <label for="addc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add something by link</label>
      <input id="addc" type="url" placeholder="Paste a link to add something" style="width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; color: #141414; background: #ffffff; border: 1px solid #d6d6d2; border-radius: 0; padding: 14px 16px; min-height: 52px">
    </form>

    <ul style="list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 2px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <li>
          <a href="#" aria-label="Edit {{item.name}}" style="display: block; position: relative; aspect-ratio: 1 / 1; background: {{item.tone}}; cursor: grab">
            <sc-if value="{{item.got}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; inset: 0; background: rgba(244,244,242,0.72)"></span>
              <span style="position: absolute; left: 12px; bottom: 10px; font-size: 13px; font-weight: 500">You got this</span>
            </sc-if>
          </a>
          <div style="padding: 10px 12px 0 0">
            <div style="font-size: 15px; font-weight: 500; line-height: 1.3; color: {{item.ink}}">{{item.name}}</div>
            <div style="margin-top: 4px; font-size: 13px; color: #6a6a66">{{item.shop}} · {{item.price}}</div>
            <sc-if value="{{item.starred}}" hint-placeholder-val="{{false}}">
              <div style="margin-top: 4px; font-size: 13px; font-weight: 500; color: {{accent}}">Want most</div>
            </sc-if>
          </div>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b3261e","options":["#b3261e","#2547d0","#141414"]},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { name: 'AirPods Pro 3', shop: 'Apple', price: '€279,00', starred: true, tone: '#e2e1dc' },
      { name: 'Kindle Paperwhite, 16 GB', shop: 'Amazon', price: '€169,99', tone: '#2f2f2d' },
      { name: 'Moka Express, 6 cups', shop: 'Bialetti', price: '€42,90', tone: '#b4b3ad' },
      { name: 'In Rainbows — Radiohead, LP', shop: 'Fnac', price: '€32,99', starred: true, tone: '#cfc8b9' },
      { name: 'Merino crew-neck, size M', shop: 'Uniqlo', price: '€39,90', got: true, tone: '#56606c' },
      { name: 'Bonsai Tree 10281', shop: 'LEGO', price: '€49,99', tone: '#7b8868' }
    ];
    return {
      accent: this.props.accent ?? '#b3261e',
      items: items.map((it) => ({
        ...it,
        starred: !!it.starred,
        got: !!it.got,
        ink: it.got ? '#6a6a66' : '#141414'
      }))
    };
  }
}
</script>
</body>
</html>
