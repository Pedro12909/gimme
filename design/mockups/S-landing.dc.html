<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gimme — landing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f4f2}
a{color:#141414;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input::placeholder{color:#6a6a66}
input:focus{outline:none;border-color:#141414}
</style>
</helmet>
<div style="font-family: 'Archivo', sans-serif; color: #141414; background: #f4f4f2; min-height: 1000px; box-sizing: border-box">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 18px 32px">
    <span style="font-weight: 700; font-size: 17px; font-stretch: 112%; letter-spacing: -0.01em">gimme</span>
    <a href="#" style="font-size: 14px">Sign in</a>
  </header>

  <main style="max-width: 1216px; margin: 0 auto; padding: 72px 32px 64px">
    <h1 style="margin: 0; max-width: 900px; font-size: 104px; line-height: 0.92; font-weight: 700; font-stretch: 72%; text-transform: uppercase; letter-spacing: -0.005em">Wishlists that keep the surprise</h1>
    <p style="margin: 28px 0 0; max-width: 520px; font-size: 18px; line-height: 1.5">Put things from any shop on a list and send one link. Friends claim what they'll give. You never find out who.</p>

    <form style="margin-top: 36px; max-width: 520px">
      <label for="email" style="display: block; font-size: 13px; color: #6a6a66">Your email</label>
      <div style="margin-top: 8px; display: flex">
        <input id="email" type="email" placeholder="you@example.com" style="flex: 1; min-width: 0; font: inherit; font-size: 16px; color: #141414; background: #ffffff; border: 1px solid #d6d6d2; border-right: 0; border-radius: 0; padding: 14px 16px; min-height: 52px; box-sizing: border-box">
        <button type="submit" style="min-height: 52px; padding: 0 20px; border: 1px solid #141414; font-size: 15px; font-weight: 500">Send code</button>
      </div>
      <p style="margin: 10px 0 0; font-size: 13px; color: #6a6a66">Invite-only for now. We'll email a code, no password.</p>
    </form>

    <p style="margin: 88px 0 12px; font-size: 13px; color: #6a6a66">What your friends see</p>
    <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 2px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
        <li>
          <div aria-hidden="true" style="position: relative; aspect-ratio: 1 / 1; background: {{item.tone}}">
            <sc-if value="{{item.taken}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; inset: 0; background: rgba(244,244,242,0.72)"></span>
              <span style="position: absolute; left: 10px; bottom: 8px; font-size: 13px; font-weight: 500">Taken</span>
            </sc-if>
          </div>
          <div style="padding: 8px 10px 0 0; font-size: 14px; font-weight: 500">{{item.name}}</div>
          <div style="margin-top: 2px; font-size: 12px; color: #6a6a66">{{item.shop}}</div>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Film camera, 35 mm', shop: 'Kamera Express', tone: '#2f2f2d' },
        { name: 'Linen bedding set', shop: 'Zara Home', tone: '#d8d3c7', taken: true },
        { name: 'Pour-over kettle', shop: 'Fellow', tone: '#b4b3ad' },
        { name: 'Climbing shoes', shop: 'Decathlon', tone: '#7b8868' },
        { name: 'Field notes, 3-pack', shop: 'Field Notes', tone: '#c9a77a', taken: true }
      ].map((it) => ({ ...it, taken: !!it.taken }))
    };
  }
}
</script>
</body>
</html>
