<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gimme — colored tiles (owner)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f4f2}
a{color:#141414;text-decoration:none}
nav a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:hover{text-decoration:underline;text-underline-offset:3px}
input::placeholder{color:#6a6a66}
input:focus{outline:none;border-color:#141414}
.p{display:block;width:100%;height:100%}
</style>
</helmet>
<div style="font-family: 'Archivo', sans-serif; color: #141414; background: #f4f4f2; min-height: 1000px; box-sizing: border-box">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 18px 32px">
    <span style="font-weight: 700; font-size: 17px; font-stretch: 112%; letter-spacing: -0.01em">gimme</span>
    <nav style="display: flex; gap: 24px; font-size: 14px"><a href="#">Lists</a><a href="#">Account</a></nav>
  </header>

  <main style="max-width: 1216px; margin: 0 auto; padding: 32px 32px 64px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px">
      <div>
        <h1 style="margin: 0; font-size: 56px; line-height: 1; font-weight: 700; font-stretch: 75%; letter-spacing: -0.01em; text-transform: uppercase">Christmas 2026</h1>
        <p style="margin: 10px 0 0; font-size: 14px; color: #6a6a66">25 December · 6 things</p>
      </div>
      <div style="display: flex; gap: 24px; font-size: 14px">
        <button type="button">Copy share link</button>
        <button type="button">Settings</button>
      </div>
    </div>

    <form style="margin-top: 32px">
      <label for="addk" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add something by link</label>
      <input id="addk" type="url" placeholder="Paste a link to add something" style="width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; color: #141414; background: #ffffff; border: 1px solid #d6d6d2; border-radius: 0; padding: 14px 16px; min-height: 52px">
    </form>

    <ul style="list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 2px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <li>
          <a href="#" aria-label="Edit {{item.name}}" style="display: block; position: relative; aspect-ratio: 1 / 1; background: {{item.bg}}">
            <sc-if value="{{item.isCase}}" hint-placeholder-val="{{false}}">
              <svg class="p" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="70" rx="20" ry="2.6" fill="#000" opacity="0.08"></ellipse><rect x="31" y="36" width="38" height="32" rx="11" fill="#fbfbfa" stroke="#d6d6d2" stroke-width="0.6"></rect><line x1="31.5" y1="47" x2="68.5" y2="47" stroke="#d2d2ce" stroke-width="0.6"></line><circle cx="50" cy="57" r="1.2" fill="#c4c4bf"></circle></svg>
            </sc-if>
            <sc-if value="{{item.isReader}}" hint-placeholder-val="{{false}}">
              <svg class="p" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="79" rx="18" ry="2.4" fill="#000" opacity="0.09"></ellipse><rect x="33" y="20" width="34" height="57" rx="3" fill="#1e1e1d"></rect><rect x="36.5" y="25" width="27" height="41" fill="#dcdcd6"></rect><rect x="40" y="31" width="20" height="1.4" fill="#a7a7a1"></rect><rect x="40" y="35" width="17" height="1.4" fill="#a7a7a1"></rect><rect x="40" y="39" width="19" height="1.4" fill="#a7a7a1"></rect><rect x="40" y="43" width="14" height="1.4" fill="#a7a7a1"></rect></svg>
            </sc-if>
            <sc-if value="{{item.isMoka}}" hint-placeholder-val="{{false}}">
              <svg class="p" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="79" rx="17" ry="2.4" fill="#000" opacity="0.1"></ellipse><polygon points="36,78 64,78 60,56 40,56" fill="#a8a8a4"></polygon><polygon points="40,56 50,56 50,78 36,78" fill="#bcbcb8"></polygon><rect x="38" y="53" width="24" height="3.5" fill="#7c7c78"></rect><polygon points="39,53 61,53 57,32 43,32" fill="#9b9b97"></polygon><polygon points="43,32 50,32 50,53 39,53" fill="#b1b1ad"></polygon><polygon points="42,32 58,32 55,26 45,26" fill="#8a8a86"></polygon><rect x="48" y="22" width="4" height="4" fill="#1e1e1d"></rect><path d="M60,36 L71,38 L69,52 L59,50" fill="none" stroke="#1e1e1d" stroke-width="3.5"></path></svg>
            </sc-if>
            <sc-if value="{{item.isRecord}}" hint-placeholder-val="{{false}}">
              <svg class="p" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="52" cy="76" rx="26" ry="2.6" fill="#000" opacity="0.08"></ellipse><circle cx="60" cy="49" r="24" fill="#161616"></circle><circle cx="60" cy="49" r="19" fill="none" stroke="#2b2b2b" stroke-width="0.6"></circle><circle cx="60" cy="49" r="14" fill="none" stroke="#2b2b2b" stroke-width="0.6"></circle><circle cx="60" cy="49" r="7" fill="#d9a441"></circle><rect x="22" y="25" width="45" height="48" fill="#2f4b66"></rect><rect x="28" y="31" width="20" height="2" fill="#e9e4d8"></rect><rect x="28" y="35" width="13" height="2" fill="#e9e4d8"></rect><circle cx="52" cy="58" r="8" fill="none" stroke="#c9563d" stroke-width="2"></circle></svg>
            </sc-if>
            <sc-if value="{{item.isJumper}}" hint-placeholder-val="{{false}}">
              <svg class="p" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="78" rx="21" ry="2.4" fill="#000" opacity="0.08"></ellipse><path d="M30,30 L42,24 Q50,31 58,24 L70,30 L79,47 L71,51 L68,43 L68,76 L32,76 L32,43 L29,51 L21,47 Z" fill="#3b4a5e"></path><path d="M42,24 Q50,33 58,24" fill="none" stroke="#2b3747" stroke-width="2"></path><rect x="32" y="72" width="36" height="4" fill="#33414f"></rect></svg>
            </sc-if>
            <sc-if value="{{item.isBonsai}}" hint-placeholder-val="{{false}}">
              <svg class="p" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="75" rx="19" ry="2.4" fill="#000" opacity="0.09"></ellipse><rect x="34" y="64" width="32" height="10" fill="#6b4a3a"></rect><rect x="31" y="61" width="38" height="4" fill="#5a3d30"></rect><path d="M50,62 C47,55 55,50 50,40" fill="none" stroke="#5a4030" stroke-width="3"></path><ellipse cx="39" cy="40" rx="12" ry="7" fill="#4f6b3a"></ellipse><ellipse cx="61" cy="36" rx="13" ry="7.5" fill="#5f7d45"></ellipse><ellipse cx="50" cy="28" rx="11" ry="6.5" fill="#56743f"></ellipse></svg>
            </sc-if>
            <sc-if value="{{item.got}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; inset: 0; background: rgba(244,244,242,0.72)"></span>
              <span style="position: absolute; left: 12px; bottom: 10px; font-size: 13px; font-weight: 500">You got this</span>
            </sc-if>
          </a>
          <div style="padding: 10px 12px 0 0">
            <div style="font-size: 15px; font-weight: 500; line-height: 1.3; color: {{item.ink}}">{{item.name}}</div>
            <div style="margin-top: 4px; font-size: 13px; color: #6a6a66">{{item.shop}} · {{item.price}}</div>
            <sc-if value="{{item.starred}}" hint-placeholder-val="{{false}}">
              <div style="margin-top: 4px; font-size: 13px; font-weight: 500; color: #b3261e">Want most</div>
            </sc-if>
          </div>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { kind: 'Case', name: 'AirPods Pro 3', shop: 'Apple', price: '€279,00', starred: true, bg: '#dde4ec' },
      { kind: 'Reader', name: 'Kindle Paperwhite, 16 GB', shop: 'Amazon', price: '€169,99', bg: '#eadfce' },
      { kind: 'Moka', name: 'Moka Express, 6 cups', shop: 'Bialetti', price: '€42,90', bg: '#efdad1' },
      { kind: 'Record', name: 'In Rainbows — Radiohead, LP', shop: 'Fnac', price: '€32,99', starred: true, bg: '#e2e5d2' },
      { kind: 'Jumper', name: 'Merino crew-neck, size M', shop: 'Uniqlo', price: '€39,90', got: true, bg: '#ece3d4' },
      { kind: 'Bonsai', name: 'Bonsai Tree 10281', shop: 'LEGO', price: '€49,99', bg: '#dae4d4' }
    ];
    return {
      items: items.map((it) => ({
        ...it,
        isCase: it.kind === 'Case', isReader: it.kind === 'Reader', isMoka: it.kind === 'Moka',
        isRecord: it.kind === 'Record', isJumper: it.kind === 'Jumper', isBonsai: it.kind === 'Bonsai',
        starred: !!it.starred, got: !!it.got,
        ink: it.got ? '#6a6a66' : '#141414'
      }))
    };
  }
}
</script>
</body>
</html>
