<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gimme — enter your code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input:focus{outline:none;border-color:#141414}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f4f4f2; color: #141414; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column">
  <header style="padding: 16px 16px 0"><span style="font-weight: 700; font-size: 16px; font-stretch: 112%">gimme</span></header>

  <main style="padding: 72px 16px 0">
    <h1 style="margin: 0; font-size: 44px; line-height: 0.95; font-weight: 700; font-stretch: 75%; text-transform: uppercase">Check your email</h1>
    <p style="margin: 16px 0 0; font-size: 15px; line-height: 1.5">We sent a code to <span style="font-weight: 500">pedro@example.com</span>. It works for 10 minutes.</p>

    <form style="margin-top: 32px">
      <label for="code" style="display: block; font-size: 13px; color: #6a6a66">Code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" value="4 8 1 0" style="margin-top: 8px; width: 100%; box-sizing: border-box; font: inherit; font-size: 32px; font-weight: 500; letter-spacing: 0.2em; color: #141414; background: #ffffff; border: 1px solid #141414; border-radius: 0; padding: 12px 16px; min-height: 64px">
      <button type="submit" style="margin-top: 16px; width: 100%; min-height: 52px; border: 1px solid #141414; font-size: 16px; font-weight: 500">Sign in</button>
    </form>

    <p style="margin: 24px 0 0; font-size: 14px; color: #6a6a66">Nothing yet? <button type="button" style="color: #141414; text-decoration: underline; text-underline-offset: 3px">Send again</button> or <button type="button" style="color: #141414; text-decoration: underline; text-underline-offset: 3px">use another email</button></p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
