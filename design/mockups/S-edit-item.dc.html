<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gimme — edit item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f4f2}
a{color:#141414;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:15px;color:#141414;background:#ffffff;border:1px solid #d6d6d2;border-radius:0;padding:11px 12px;width:100%;box-sizing:border-box}
input:focus,textarea:focus{outline:none;border-color:#141414}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#6a6a66}
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:#141414;border-radius:0}
</style>
</helmet>
<div style="font-family: 'Archivo', sans-serif; color: #141414; background: #f4f4f2; min-height: 1000px; box-sizing: border-box; display: flex; flex-direction: column">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 18px 32px">
    <span style="font-weight: 700; font-size: 17px; font-stretch: 112%; letter-spacing: -0.01em">gimme</span>
    <nav style="display: flex; gap: 24px; font-size: 14px"><a href="#">Lists</a><a href="#">Account</a></nav>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 64px; box-sizing: border-box">
      <h1 style="margin: 0; font-size: 56px; line-height: 1; font-weight: 700; font-stretch: 75%; text-transform: uppercase">Christmas 2026</h1>
      <p style="margin: 10px 0 0; font-size: 14px; color: #6a6a66">25 December · 6 things</p>
      <ul style="list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 2px">
        <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
          <li style="opacity: {{item.dim}}">
            <div aria-hidden="true" style="aspect-ratio: 1 / 1; background: {{item.tone}}; outline: {{item.ring}}; outline-offset: 4px"></div>
            <div style="padding: 10px 12px 0 0; font-size: 15px; font-weight: 500">{{item.name}}</div>
            <div style="margin-top: 4px; font-size: 13px; color: #6a6a66">{{item.shop}} · {{item.price}}</div>
          </li>
        </sc-for>
      </ul>
    </main>

    <aside aria-label="Edit item" style="flex: 1 1 400px; max-width: 460px; background: #ffffff; border-left: 1px solid #d6d6d2; padding: 28px 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; font-stretch: 80%; text-transform: uppercase">Edit</h2>
        <button type="button" style="font-size: 14px; text-decoration: underline; text-underline-offset: 3px">Close</button>
      </div>

      <div style="display: flex; gap: 14px; align-items: center">
        <div aria-hidden="true" style="width: 72px; height: 72px; background: #e2e1dc; flex: none"></div>
        <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #6a6a66">Name, photo and price filled in from apple.com. Change anything that's off.</p>
      </div>

      <label class="f">Link<input type="url" value="https://www.apple.com/pt/airpods-pro/"></label>
      <label class="f">Name<input type="text" value="AirPods Pro 3"></label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label class="f">Price<input type="text" value="€279,00"></label>
        <label class="f">Shop<input type="text" value="Apple"></label>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label class="f">Size or colour<input type="text" placeholder="Optional"></label>
        <label class="f">Tags<input type="text" value="audio" placeholder="Separate with commas"></label>
      </div>
      <label class="f">Note for guests<textarea rows="2" placeholder="e.g. any colour but white"></textarea></label>
      <label class="f">Other places to buy it<input type="url" placeholder="Paste another link (optional)"></label>

      <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 4px">
        <label style="display: flex; gap: 10px; align-items: center; font-size: 15px"><input type="checkbox" checked="checked">Want this most</label>
        <label style="display: flex; gap: 10px; align-items: center; font-size: 15px"><input type="checkbox">Got it already <span style="color: #6a6a66; font-size: 13px">— guests can't claim it</span></label>
      </div>

      <div style="margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 20px">
        <button type="submit" style="min-height: 48px; padding: 0 24px; border: 1px solid #141414; font-size: 15px; font-weight: 500">Save</button>
        <button type="button" style="font-size: 15px; text-decoration: underline; text-underline-offset: 3px">Cancel</button>
        <button type="button" style="margin-left: auto; font-size: 15px; color: #b3261e; text-decoration: underline; text-underline-offset: 3px">Remove</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { name: 'AirPods Pro 3', shop: 'Apple', price: '€279,00', tone: '#e2e1dc', on: true },
      { name: 'Kindle Paperwhite, 16 GB', shop: 'Amazon', price: '€169,99', tone: '#2f2f2d' },
      { name: 'Moka Express, 6 cups', shop: 'Bialetti', price: '€42,90', tone: '#b4b3ad' },
      { name: 'In Rainbows — Radiohead, LP', shop: 'Fnac', price: '€32,99', tone: '#cfc8b9' },
      { name: 'Merino crew-neck, size M', shop: 'Uniqlo', price: '€39,90', tone: '#56606c' },
      { name: 'Bonsai Tree 10281', shop: 'LEGO', price: '€49,99', tone: '#7b8868' }
    ];
    return {
      items: items.map((it) => ({ ...it, dim: it.on ? '1' : '0.45', ring: it.on ? '1px solid #141414' : 'none' }))
    };
  }
}
</script>
</body>
</html>
